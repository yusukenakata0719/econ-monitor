name: Macro Monitor

on:
  schedule:
    # 毎日 08:00 JST: 新たな異常の発生・解消があれば通知
    - cron: "0 23 * * *"
    # 毎週月曜 08:30 JST: アクティブな異常をまとめた週次ダイジェスト
    - cron: "30 23 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "changes=変化があれば通知 / digest=アクティブな異常をすべて通知"
        type: choice
        options: [changes, digest]
        default: changes
      dry_run:
        description: "Slack に送らず状態も保存しない（ジョブサマリーで結果を確認）"
        type: boolean
        default: false
      no_notify:
        description: "Slack に送らず状態だけ更新する（初回に既存の異常を一括通知したくない場合）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      # アラート状態（どの異常を通知済みか）を前回の実行から引き継ぐ
      - name: Restore alert state
        uses: actions/cache/restore@v6
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Run monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MODE: ${{ github.event.schedule == '30 23 * * 0' && 'digest' || inputs.mode || 'changes' }}
          EXTRA_ARGS: ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.no_notify && '--no-notify' || '' }}
        run: |
          econ-monitor \
            --config config/indicators.yaml \
            --state state/alerts.json \
            --report reports/report.md \
            --data-dir reports/data \
            --mode "$MODE" \
            $EXTRA_ARGS

      - name: Save alert state
        if: always() && hashFiles('state/alerts.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state
          key: alert-state-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macro-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
